name: Legacy manual deploy to Amazon ECS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quizbattle-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy immutable image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Test
        working-directory: src
        run: go test -race -count=1 ./...

      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in AWS_REGION ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE ECS_TASK_DEFINITION CONTAINER_NAME; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions variable: $name"
              exit 1
            fi
          done

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Enforce single-replica and immutable-registry baseline
        shell: bash
        run: |
          read -r desired minimum maximum <<< "$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].[desiredCount,deploymentConfiguration.minimumHealthyPercent,deploymentConfiguration.maximumPercent]' \
            --output text)"
          if [ "$desired" != "1" ] || [ "$minimum" != "0" ] || [ "$maximum" != "100" ]; then
            echo "QuizBattle currently requires desiredCount=1, minimumHealthyPercent=0, and maximumPercent=100."
            exit 1
          fi
          mutability="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].imageTagMutability' \
            --output text)"
          if [ "$mutability" != "IMMUTABLE" ]; then
            echo "The ECR repository must have immutable tags enabled."
            exit 1
          fi

      - name: Build and push immutable image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          tagged_image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          existing_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"
          if [[ "$existing_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "The immutable commit tag already exists; refusing to deploy an artifact not built by this run."
            exit 1
          fi
          docker build --tag "$tagged_image" .
          push_output="$(docker push "$tagged_image")"
          echo "$push_output"
          digest="$(printf '%s\n' "$push_output" | awk '{for (field = 1; field <= NF; field++) if ($field ~ /^sha256:/) value = $field} END {print value}')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve the pushed image digest."
            exit 1
          fi
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Download active task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            > "${{ runner.temp }}/task-definition.json"

      - name: Render immutable image into task definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@6853cfae8c3a7d978fbf68b5a55453395541dfbb # v1.8.5
        with:
          task-definition: ${{ runner.temp }}/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}
          environment-variables: |
            RELEASE_SHA=${{ github.sha }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          enable-ecs-managed-tags: true
          propagate-tags: SERVICE
